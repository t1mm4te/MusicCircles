name: MusicCircles CI Suite

on:
  push:
    branches: [ main, 'feature/*' ]
  pull_request:
    branches: [ main, 'feature/*' ]

env:
  TB_TOKEN: "dummy_token"
  YANDEX_MUSIC_API_TOKEN: ${{ secrets.YANDEX_TOKEN }}
  DOWNLOAD_FOLDER: "downloads"
  AUDIO_RECEIVER_API_URL: "http://audio_receiver:9000"
  MEDIA_PROCESSOR_API_URL: "http://media_processor:8000"
  DATABASE_API_URL: "http://database:8001"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build

  unit-tests:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [database, audio_receiver, media_processor, telegram_bot]
    steps:
      - uses: actions/checkout@v4
      - name: Run Unit Tests
        run: |
          # Используем -e для прямой передачи переменных в контейнер
          docker compose run --rm \
            -e YANDEX_MUSIC_API_TOKEN="${{ env.YANDEX_MUSIC_API_TOKEN }}" \
            -e TB_TOKEN="${{ env.TB_TOKEN }}" \
            -e DATABASE_PATH=":memory:" \
            ${{ matrix.service }} pytest tests/unit -v

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          echo "TB_TOKEN=${{ env.TB_TOKEN }}" > .env
          echo "YANDEX_MUSIC_API_TOKEN=${{ env.YANDEX_MUSIC_API_TOKEN }}" >> .env
          echo "AUDIO_RECEIVER_API_URL=${{ env.AUDIO_RECEIVER_API_URL }}" >> .env
          echo "MEDIA_PROCESSOR_API_URL=${{ env.MEDIA_PROCESSOR_API_URL }}" >> .env
          echo "DATABASE_API_URL=${{ env.DATABASE_API_URL }}" >> .env

      - name: Start Infrastructure
        run: |
          # Поднимаем сервисы. Они подхватят .env через env_file в compose.yaml
          docker compose up -d database audio_receiver media_processor
          sleep 15
          docker compose ps  # Проверка статуса (должны быть Up/Healthy)

      - name: Run Integration Tests
        run: |
          docker compose run --rm \
            -e TB_TOKEN="${{ env.TB_TOKEN }}" \
            -e AUDIO_RECEIVER_API_URL="${{ env.AUDIO_RECEIVER_API_URL }}" \
            -e MEDIA_PROCESSOR_API_URL="${{ env.MEDIA_PROCESSOR_API_URL }}" \
            -e DATABASE_API_URL="${{ env.DATABASE_API_URL }}" \
            telegram_bot pytest tests/integration -v --asyncio-mode=auto

  e2e-tests:
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          echo "TB_TOKEN=${{ env.TB_TOKEN }}" > .env
          echo "YANDEX_MUSIC_API_TOKEN=${{ env.YANDEX_MUSIC_API_TOKEN }}" >> .env
          echo "AUDIO_RECEIVER_API_URL=${{ env.AUDIO_RECEIVER_API_URL }}" >> .env
          echo "MEDIA_PROCESSOR_API_URL=${{ env.MEDIA_PROCESSOR_API_URL }}" >> .env
          echo "DATABASE_API_URL=${{ env.DATABASE_API_URL }}" >> .env

      - name: Full System Launch
        run: |
          docker compose up -d
          sleep 20

      - name: Run E2E Scenarios
        run: |
          docker compose run --rm \
            -e TB_TOKEN="${{ env.TB_TOKEN }}" \
            -e YANDEX_MUSIC_API_TOKEN="${{ env.YANDEX_MUSIC_API_TOKEN }}" \
            -e AUDIO_RECEIVER_API_URL="${{ env.AUDIO_RECEIVER_API_URL }}" \
            -e MEDIA_PROCESSOR_API_URL="${{ env.MEDIA_PROCESSOR_API_URL }}" \
            -e DATABASE_API_URL="${{ env.DATABASE_API_URL }}" \
            telegram_bot pytest tests/e2e -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs