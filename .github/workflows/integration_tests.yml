name: Teleram Bot Integration Tests

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main
      - 'feature/*'

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: telegram_bot

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-asyncio httpx python-telegram-bot pydantic

      - name: Create dummy .env file
        run: |
          echo "TB_TOKEN=dummy_token" > .env
          echo "DOWNLOAD_FOLDER=downloads" >> .env
          echo "AUDIO_RECEIVER_API_URL=http://localhost:8001" >> .env
          echo "MEDIA_PROCESSOR_API_URL=http://localhost:8002" >> .env
          echo "DATABASE_API_URL=http://localhost:8003" >> .env

      - name: Run Integration Tests
        run: |
          pytest tests/integration/ -v --asyncio-mode=auto